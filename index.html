<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocLegal IA — Clasificador Local</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Esta librería lee PDFs desde el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

    <header>
        <div class="logo">⚖️ DocLegal IA</div>
        <div class="status" id="statusBadge">Verificando modelo...</div>
    </header>

    <main>
        <!-- Panel izquierdo: subir archivos -->
        <section class="panel-izquierdo">

            <div class="zona-subida" id="zonaSubida">
                <input type="file" id="inputArchivos" multiple accept=".pdf,.png,.jpg,.jpeg">
                <p>📄 Arrastra documentos aquí</p>
                <small>PDFs o imágenes escaneadas — Facturas, RUT, DIAN, Contratos</small>
            </div>

            <div id="listaArchivos"></div>

            <div class="acciones">
                <button id="btnClasificar" onclick="clasificarTodo()" disabled>
                    ✨ Clasificar documentos
                </button>
                <button onclick="limpiarTodo()">Limpiar</button>
            </div>

            <!-- Barra de progreso -->
            <div class="barra-wrap" id="barraWrap">
                <div class="barra-fill" id="barraFill"></div>
            </div>

        </section>

        <!-- Panel derecho: resultados -->
        <section class="panel-derecho">
            <div class="panel-header">
                <h2>Resultados</h2>
                <span id="contadorResultados" class="contador">0</span>
            </div>

            <div id="estadoVacio" class="estado-vacio">
                <p>🗂️ Sube documentos y haz clic en<br><strong>Clasificar documentos</strong></p>
            </div>

            <div id="listaResultados"></div>

            <div class="exportar" id="seccionExportar" style="display:none">
                <button onclick="exportarCSV()">📊 Exportar CSV</button>
                <button onclick="exportarJSON()">{ } Exportar JSON</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
